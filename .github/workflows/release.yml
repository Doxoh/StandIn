name: Release

# Publishes only on a git tag like v1.0.1. Signs in to nuget.org through
# Trusted Publishing (OIDC): no API key, only the secret NUGET_USER (nuget.org profile name).
# The policy on nuget.org names repo Doxoh/StandIn, workflow release.yml, environment nuget.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # OIDC token for NuGet/login

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget   # set up the environment with required approval
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release
      - run: dotnet pack -c Release -o artifacts
      - name: NuGet login (OIDC, short-lived key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # profile name, not the email address
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.*nupkg
          prerelease: ${{ contains(github.ref_name, '-') }}
