version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    # Framework packages follow the respective target framework (net8.0 -> 8.x, net10.0 -> 10.x).
    # Major versions are therefore not bumped automatically, only patches and minors.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns: ["Microsoft.*"]
      test:
        patterns: ["xunit*", "coverlet*", "Microsoft.NET.Test.Sdk"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
